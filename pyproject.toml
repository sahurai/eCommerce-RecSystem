[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "ecommerce_recsystem"
version = "0.0.1"
description = "Recommendation system for eCommerce based on implicit content filtering."
authors = [
  { name = "Ilia Sukhina and Milan Mikulas" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    
]
requires-python = "~=3.12.0"


[tool.ruff]
line-length = 99
src = ["ecommerce_recsystem"]
include = ["pyproject.toml", "ecommerce_recsystem/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["ecommerce_recsystem"]
force-sort-within-sections = true

